name: Hosting releases (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit logs and project inventory
        env:
          GCP_ACCOUNT_KEY: ${{ secrets.GCP_ACCOUNT_KEY }}
        run: |
          echo "$GCP_ACCOUNT_KEY" > key.json
          PROJECT_ID=$(node -p "require('./key.json').project_id")
          gcloud auth activate-service-account --key-file=key.json -q
          gcloud config set project "$PROJECT_ID" -q
          rm -f key.json
          echo "::group::AUDIT: hosting releases/versions by non-CI principals (last 7 days)"
          gcloud logging read 'protoPayload.serviceName="firebasehosting.googleapis.com" AND (protoPayload.methodName:"CreateRelease" OR protoPayload.methodName:"CreateVersion" OR protoPayload.methodName:"PopulateVersionFiles")' \
            --freshness=7d --limit=40 --format='value(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail,protoPayload.requestMetadata.callerIp,protoPayload.requestMetadata.callerSuppliedUserAgent,protoPayload.authenticationInfo.serviceAccountDelegationInfo)' 2>&1 | head -60
          echo "::endgroup::"
          echo "::group::AUDIT: everything done by the appspot SA (last 7 days)"
          gcloud logging read "protoPayload.authenticationInfo.principalEmail=\"$PROJECT_ID@appspot.gserviceaccount.com\"" \
            --freshness=7d --limit=40 --format='value(timestamp,protoPayload.serviceName,protoPayload.methodName,protoPayload.requestMetadata.callerIp,protoPayload.requestMetadata.callerSuppliedUserAgent)' 2>&1 | head -60
          echo "::endgroup::"
          echo "::group::AUDIT: token/key usage for appspot SA (IAM)"
          gcloud logging read "protoPayload.serviceName=\"iam.googleapis.com\" AND protoPayload.resourceName:\"$PROJECT_ID@appspot.gserviceaccount.com\"" \
            --freshness=30d --limit=20 --format='value(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail,protoPayload.requestMetadata.callerIp)' 2>&1 | head -30
          echo "::endgroup::"
          echo "::group::INVENTORY"
          echo "--- cloud build (last 10)"; gcloud builds list --limit=10 --format='value(createTime,status,substitutions.REPO_NAME,substitutions.TRIGGER_NAME,source)' 2>&1 | head -15
          echo "--- cloud build triggers"; gcloud builds triggers list --format='value(name,github.name,github.owner,serviceAccount)' 2>&1 | head -10
          echo "--- scheduler"; gcloud scheduler jobs list --format='value(name,schedule,httpTarget.uri)' 2>&1 | head -10
          echo "--- functions"; gcloud functions list --format='value(name,runtime,serviceAccountEmail,updateTime)' 2>&1 | head -10
          echo "--- cloud run"; gcloud run services list --format='value(name,region)' 2>&1 | head -10
          echo "--- app engine"; gcloud app services list 2>&1 | head -5
          echo "--- SA keys (appspot)"; gcloud iam service-accounts keys list --iam-account="$PROJECT_ID@appspot.gserviceaccount.com" --managed-by=user 2>&1 | head -10
          echo "--- IAM bindings of appspot SA"; gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.members:$PROJECT_ID@appspot.gserviceaccount.com" --format='value(bindings.role)' 2>&1 | head -10
          echo "--- all IAM members"; gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --format='value(bindings.role,bindings.members)' 2>&1 | head -40
          echo "::endgroup::"
