name: IAM hardening (temporary)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove roles/editor from App Engine default service account
        env:
          GCP_ACCOUNT_KEY: ${{ secrets.GCP_ACCOUNT_KEY }}
        run: |
          echo "$GCP_ACCOUNT_KEY" > key.json
          PROJECT_ID=$(node -p "require('./key.json').project_id")
          gcloud auth activate-service-account --key-file=key.json -q
          rm -f key.json
          SA="$PROJECT_ID@appspot.gserviceaccount.com"
          echo "--- before"; gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.members:$SA" --format='value(bindings.role)'
          gcloud projects remove-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$SA" --role="roles/editor" -q > /dev/null
          echo "--- after"; gcloud projects get-iam-policy "$PROJECT_ID" --flatten='bindings[].members' --filter="bindings.members:$SA" --format='value(bindings.role)'; echo "(fim)"
